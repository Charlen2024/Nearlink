name: Build and publish Nearlink

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish windows/Nearlink.Native.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o "$env:RUNNER_TEMP/nearlink-windows"
          Set-Content -Path "$env:RUNNER_TEMP/nearlink-windows/README.txt" -Value "Nearlink Windows x64. Extract this archive and run Nearlink.exe."
          Compress-Archive -Path "$env:RUNNER_TEMP/nearlink-windows/*" -DestinationPath "$env:RUNNER_TEMP/Nearlink-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nearlink-windows
          path: ${{ runner.temp }}/Nearlink-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.NEARLINK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEARLINK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEARLINK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEARLINK_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing Android signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nearlink-release.jks"
          echo "NEARLINK_KEYSTORE_PATH=$RUNNER_TEMP/nearlink-release.jks" >> "$GITHUB_ENV"
          echo "NEARLINK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEARLINK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEARLINK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NEARLINK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NEARLINK_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Nearlink-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nearlink-android
          path: ${{ runner.temp }}/Nearlink-Android.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nearlink-windows
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: nearlink-android
          path: artifacts
      - name: Generate update manifests
        env:
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${TAG#v}"
          WINDOWS_SHA=$(sha256sum artifacts/Nearlink-Windows-x64.zip | cut -d' ' -f1)
          ANDROID_SHA=$(sha256sum artifacts/Nearlink-Android.apk | cut -d' ' -f1)
          python3 - "$VERSION" "$VERSION_CODE" "$WINDOWS_SHA" "$ANDROID_SHA" <<'PY'
          import json, pathlib, sys
          version, workflow_run_number, win_sha, android_sha = sys.argv[1:]
          files = {
              "windows.json": {"platform":"windows", "version":version, "minimumVersion":version, "notes":f"Nearlink {version} 已发布。", "sha256":win_sha},
              "android.json": {"platform":"android", "version":version, "versionCode":int(workflow_run_number) + 1, "minimumVersion":version, "notes":f"Nearlink {version} 已发布。", "sha256":android_sha},
          }
          for name, value in files.items():
              pathlib.Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/Nearlink-Windows-x64.zip artifacts/Nearlink-Android.apk --clobber
          else
            gh release create "$TAG" artifacts/Nearlink-Windows-x64.zip artifacts/Nearlink-Android.apk --title "Nearlink ${TAG#v}" --generate-notes
          fi
      - name: Install update files on the website server
        env:
          DEPLOY_HOST: ${{ secrets.NEARLINK_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.NEARLINK_SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.NEARLINK_SERVER_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NEARLINK_SERVER_KNOWN_HOSTS }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing server deployment secrets"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/nearlink_deploy
          chmod 600 ~/.ssh/nearlink_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          REMOTE_TMP="/tmp/nearlink-release"
          RELEASE_URL="https://github.com/Charlen2024/Nearlink/releases/download/$TAG"
          ssh -i ~/.ssh/nearlink_deploy "$TARGET" "rm -rf '$REMOTE_TMP' && mkdir -m 700 '$REMOTE_TMP'"
          scp -i ~/.ssh/nearlink_deploy windows.json android.json "$TARGET:$REMOTE_TMP/"
          ssh -i ~/.ssh/nearlink_deploy "$TARGET" bash -s -- "$REMOTE_TMP" "$RELEASE_URL" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staging_dir="$1"
          release_url="$2"
          curl --http1.1 --silent --show-error --fail --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --continue-at - "$release_url/Nearlink-Windows-x64.zip" --output "$staging_dir/Nearlink-Windows-x64.zip"
          curl --http1.1 --silent --show-error --fail --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --continue-at - "$release_url/Nearlink-Android.apk" --output "$staging_dir/Nearlink-Android.apk"
          sudo -n /usr/local/sbin/nearlink-install-release
          rm -rf "$staging_dir"
          REMOTE_SCRIPT
